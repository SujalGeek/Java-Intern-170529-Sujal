groups:
  - name: self-healing-rules
    rules:
      - alert: JavaErrorDetected
        expr: core_errors_total > 0 
        for: 5s     # <--- 1m se hata kar 5s (seconds) kar diya!
        labels:
          severity: critical
        annotations:
          summary: "Java Exception detected in {{ $labels.job }}" # Service ka naam bhi aayega
          description: "Triggering AI Remediation for automated fix."
