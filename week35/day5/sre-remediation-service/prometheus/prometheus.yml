global:
  scrape_interval: 15s

rule_files:
  - "alert_rules.yml" # Hum ye file abhi banayenge

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - 'alertmanager:9093' # Alertmanager ka address

scrape_configs:
  - job_name: 'sre-service'
    metrics_path: '/actuator/prometheus' # <--- YE LINE ADD KARNI HAI
    static_configs:
      - targets: ['sre-remediation-service:9090']
  - job_name: 'user-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']

  - job_name: 'course-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8082']
