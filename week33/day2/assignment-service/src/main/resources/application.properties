# ===============================
# SERVER CONFIG
# ===============================
server.port=8088
spring.application.name=assignment-service

# ===============================
# DATABASE CONFIG (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://student-analytics-mysql:3306/student_analytics_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# EUREKA CONFIG
# ===============================
eureka.client.serviceUrl.defaultZone=http://discovery-service:8761/eureka/
eureka.instance.prefer-ip-address=true
# eureka.instance.hostname=localhost (Ise comment kar do, Docker mein ye IP address use karega jo better hai)

# ===============================
# JPA / HIBERNATE CONFIG
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# CONNECTION POOL (Hikari)
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework=INFO
logging.level.com.example.quiz_service=DEBUG

# ===============================
# EXTERNAL SERVICE URLs
# ===============================
nlp.service.url=http://hybrid-nlp-service:5001
ai.service.url=http://hybrid-nlp-service:5001
performance.service.url=http://performance-service:8085