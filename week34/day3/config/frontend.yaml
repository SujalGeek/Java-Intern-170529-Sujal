apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: rsujal/quizapp-frontend:v2 # Teri frontend image
        ports:
        - containerPort: 3000 # Ya 80 jo bhi tera port ho
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: LoadBalancer # Taaki browser se access ho sake
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: frontend
